name: Lesson videos

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Topics to search in the default pass (each costs 100 of the 10,000 daily quota units; the language pass adds up to 40 more, so keep max at 50 or less on a day both run)
        default: '50'
      lang:
        description: Language for the extra pass (java, python, js, cpp). Leave empty to rotate by day of the year.
        default: ''

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Drop removed videos, then search topics without one
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX: ${{ inputs.max || '50' }}
        run: |
          node tools/find-videos.js --check
          node tools/find-videos.js --max "$MAX"
      # One language per day (day of the year % 4), at most 40 searches: 50 + 40 searches stay under the 10,000-unit quota.
      - name: Search per-language videos for today's language
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LANG_INPUT: ${{ inputs.lang }}
        run: |
          langs=(python js cpp java)
          lang="$LANG_INPUT"
          if [ -z "$lang" ]; then lang="${langs[$(( 10#$(date -u +%j) % 4 ))]}"; fi
          echo "Language pass: $lang"
          node tools/find-videos.js --lang "$lang" --max 40
      - name: Check the catalog before saving it
        run: node tools/video-test.js
      # main requires a pull request, so the update goes through one: push a branch, open a PR, merge it, redeploy.
      - name: Save through a pull request and redeploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then echo "No video changes"; exit 0; fi
          branch="bot/videos-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$branch"
          git commit -m "Update lesson videos"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Update lesson videos ($(date -u +%Y-%m-%d))" \
            --body "Daily lesson-video update from the Lesson videos workflow. The catalog passed tools/video-test.js before this PR was opened.")
          gh pr merge "$url" --merge --delete-branch
          gh workflow run pages.yml --ref main
