name: Lesson videos

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (22:30 UTC)
    - cron: '17 0,2,4 * * *' # Backups: 05:47, 07:47 and 09:47 IST
  workflow_dispatch:
    inputs:
      max:
        description: Shared topic-search budget per API key across all tracks and languages (1–95)
        default: '90'
      force:
        description: Run even if another video update succeeded today (India time).
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  # One successful update per India calendar day. Failed publish attempts remain eligible for backups.
  gate:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
        run: |
          day=$(TZ=Asia/Kolkata date +%Y-%m-%d)
          since=$(date -u -d "$day 00:00:00 +0530" +%Y-%m-%dT%H:%M:%SZ)
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/videos.yml/runs?status=success&per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }} and .created_at >= \"$since\")] | length")
          if [ "$FORCE" = "true" ] || [ "$n" = "0" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "A video update already succeeded since $since: skipping this run."; fi
  videos:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Check availability and search across all tracks and languages
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_API_KEYS: ${{ secrets.YOUTUBE_API_KEYS }}
          SEARCHES_PER_KEY: ${{ inputs.max || '90' }}
        run: |
          node tools/find-videos.js --check
          node tools/video-daily.js
      - name: Check the catalog before saving it
        run: |
          node tools/video-daily-test.js
          node tools/video-publish-test.js
          node tools/video-test.js
      # main requires a pull request, so the update goes through one: push a branch, open a PR, merge it, redeploy.
      - name: Save through a pull request and redeploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then echo "No video changes; check unfinished publishing"; node tools/video-publish.js --recover; exit 0; fi
          # The app carries its own copy of the catalog: when new videos became playable, also bump the app version so
          # the Android workflow builds and uploads a new release. Turn off with the repository variable
          # VIDEO_APP_RELEASE=false; VIDEO_APP_RELEASE_MIN sets the smallest number of new videos worth a release.
          released=false
          if [ "${{ vars.VIDEO_APP_RELEASE }}" != "false" ]; then
            out=$(mktemp); GITHUB_OUTPUT="$out" node tools/video-release.js --min "${{ vars.VIDEO_APP_RELEASE_MIN || 1 }}"
            if grep -q '^released=true' "$out"; then released=true; version=$(sed -n 's/^version=//p' "$out"); git add package.json CHANGELOG-APP.md ios/App/App.xcodeproj/project.pbxproj; fi
          fi
          branch="bot/videos-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$branch"
          if [ "$released" = true ]; then git commit -m "Update lesson videos (app $version)"; else git commit -m "Update lesson videos"; fi
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Update lesson videos ($(date -u +%Y-%m-%d))" \
            --body "Daily lesson-video update from the Lesson videos workflow. The catalog passed tools/video-test.js before this PR was opened.$([ "$released" = true ] && echo " Bumps the app to $version so the new videos ship in the app.")")
          gh pr merge "$url" --merge --delete-branch
          # Wait for actual deployment/upload results, so a failed release does not suppress backup attempts.
          if [ "$released" = true ]; then node tools/video-publish.js --app; else node tools/video-publish.js; fi
