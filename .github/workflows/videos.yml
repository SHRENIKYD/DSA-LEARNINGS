name: Lesson videos

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Topics to search in this run (each costs 100 of the 10,000 daily quota units)
        default: '95'

permissions:
  contents: write
  actions: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drop removed videos, then search topics without one
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX: ${{ inputs.max || '95' }}
        run: |
          node tools/find-videos.js --check
          node tools/find-videos.js --max "$MAX"
      - name: Check the catalog before saving it
        run: node tools/video-test.js
      - name: Save and redeploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then echo "No video changes"; exit 0; fi
          git commit -m "Update lesson videos"
          git push origin HEAD:main
          gh workflow run pages.yml --ref main
