name: Lesson videos

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      max:
        description: Topics to search in this run (each costs 100 of the 10,000 daily quota units)
        default: '95'

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: videos
  cancel-in-progress: false

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Drop removed videos, then search topics without one
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MAX: ${{ inputs.max || '95' }}
        run: |
          node tools/find-videos.js --check
          node tools/find-videos.js --max "$MAX"
      - name: Check the catalog before saving it
        run: node tools/video-test.js
      # main requires a pull request, so the update goes through one: push a branch, open a PR, merge it, redeploy.
      - name: Save through a pull request and redeploy the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then echo "No video changes"; exit 0; fi
          branch="bot/videos-$(date -u +%Y%m%d-%H%M)"
          git switch -c "$branch"
          git commit -m "Update lesson videos"
          git push origin "$branch"
          url=$(gh pr create --base main --head "$branch" --title "Update lesson videos ($(date -u +%Y-%m-%d))" \
            --body "Daily lesson-video update from the Lesson videos workflow. The catalog passed tools/video-test.js before this PR was opened.")
          gh pr merge "$url" --merge --delete-branch
          gh workflow run pages.yml --ref main
