name: Database check

on:
  pull_request:
    paths: ['supabase/**', 'tools/rls-check.js', '.github/workflows/db-check.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Apply migrations and check row level security
        run: node tools/rls-check.js
