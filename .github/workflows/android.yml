name: Android app

on:
  push:
    branches: [main, claude/dsa-math-study-portal-weghh9]
    paths: ['app/**', 'src/**', 'content/**', 'vendor/**', 'android/**', 'tools/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play engine tests
        run: node tools/play-test.js

  apk:
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build app bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build-app.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: interview-mastery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Build signed release bundle (.aab) for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: interview-mastery-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Tag and release this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes() { node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const m=s.split(/^## /m).find(x=>x.startsWith('['+process.argv[1]+']'));process.stdout.write(m?m.split('\\n').slice(1).join('\\n').trim():'')" "$1"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release() {  # $1 = version, $2 = commit, $3 = title, rest = assets
            local v="$1" sha="$2" title="$3"; shift 3
            if git ls-remote --exit-code --tags origin "refs/tags/v$v" >/dev/null; then echo "v$v is already tagged"; return 0; fi
            git tag -a "v$v" "$sha" -m "$title"
            git push origin "refs/tags/v$v"
            notes "$v" > "notes-$v.md"
            gh release create "v$v" "$@" --verify-tag --title "$title" --notes-file "notes-$v.md"
          }
          release 1.0.0 db7338f7b7e2d598fdbc9cc451f21f852664a97a "v1.0.0 · website launch"
          V=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "interview-mastery-v$V-debug.apk"
          ASSETS="interview-mastery-v$V-debug.apk"
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "interview-mastery-v$V.aab"; ASSETS="$ASSETS interview-mastery-v$V.aab"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "NEW_RELEASE=false" >> "$GITHUB_ENV"; else echo "NEW_RELEASE=true" >> "$GITHUB_ENV"; fi
          release "$V" "$GITHUB_SHA" "v$V" $ASSETS
      - name: Upload to Google Play (internal testing)
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true' && env.NEW_RELEASE == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.shrenikyd.interviewmastery
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  apk-preview:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build app bundle (accounts off)
        run: node tools/build-app.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: interview-mastery-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
