name: Android app

on:
  push:
    branches: [main, claude/dsa-math-study-portal-weghh9]
    paths: ['app/**', 'src/**', 'content/**', 'vendor/**', 'android/**', 'tools/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['app/**', 'src/**', 'content/**', 'vendor/**', 'android/**', 'tools/**', 'package.json', 'package-lock.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Play engine and update tests
        run: |
          node tools/build.js site
          node tools/play-test.js
          node tools/update-test.js
          node tools/icon-test.js
          node tools/fun-test.js
          node tools/app-navigation-test.js

  apk:
    needs: test
    runs-on: ubuntu-24.04
    environment: github-pages
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    env:
      HAS_UPLOAD_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build app bundle
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build-app.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interview-mastery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Build signed release bundle (.aab) for Google Play
        if: env.HAS_UPLOAD_KEY == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks" ./gradlew bundleRelease --no-daemon
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: env.HAS_UPLOAD_KEY == 'true'
        with:
          name: interview-mastery-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Tag and release this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes() { node -e "const s=require('fs').readFileSync(process.argv[2],'utf8');const m=s.split(/^## /m).find(x=>x.startsWith('['+process.argv[1]+']'));process.stdout.write(m?m.split('\\n').slice(1).join('\\n').trim():'')" "$1" "$2"; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          release() {  # $1 = tag, $2 = version, $3 = changelog, $4 = commit, $5 = title, rest = assets
            local tag="$1" v="$2" log="$3" sha="$4" title="$5"; shift 5
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then echo "$tag is already tagged"; return 0; fi
            git tag -a "$tag" "$sha" -m "$title"
            git push origin "refs/tags/$tag"
            notes "$v" "$log" > "notes-$tag.md"
            gh release create "$tag" "$@" --verify-tag --title "$title" --notes-file "notes-$tag.md"
          }
          release v1.0.0 1.0.0 CHANGELOG.md db7338f7b7e2d598fdbc9cc451f21f852664a97a "v1.0.0 · website launch"
          V=$(node -p "require('./package.json').appVersion")
          ASSETS=""
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then cp android/app/build/outputs/bundle/release/app-release.aab "interview-mastery-app-v$V.aab"; ASSETS="interview-mastery-app-v$V.aab"; fi
          if git ls-remote --exit-code --tags origin "refs/tags/app-v$V" >/dev/null; then echo "NEW_RELEASE=false" >> "$GITHUB_ENV"; else echo "NEW_RELEASE=true" >> "$GITHUB_ENV"; fi
          release "app-v$V" "$V" CHANGELOG-APP.md "$GITHUB_SHA" "App v$V" $ASSETS
      # Runs on every main build, not only for a new tag, so a re-run after a
      # partial failure (tag made, upload failed) can still upload.
      # PLAY_RELEASE_STATUS=inProgress with PLAY_USER_FRACTION=0.1 is a 10% staged rollout.
      # userFraction is sent only when the status is inProgress.
      - name: Upload to Google Play (track from PLAY_TRACK, default internal)
        id: play
        if: env.HAS_UPLOAD_KEY == 'true' && env.HAS_PLAY_ACCOUNT == 'true'
        continue-on-error: true
        # r0adkll/upload-google-play v1.1.5
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.shrenikyd.interviewmastery
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
          userFraction: ${{ (vars.PLAY_RELEASE_STATUS == 'inProgress' && vars.PLAY_USER_FRACTION) || '' }}
      # The action does not expose its error text, so judge by context: if this
      # version was not newly tagged in this run, a failed upload is most likely
      # "version code already used" from a re-run, so warn only. A failed upload
      # of a brand new version fails the job.
      - name: Check the Play upload result
        if: steps.play.outcome == 'failure'
        run: |
          if [ "$NEW_RELEASE" = "true" ]; then
            echo "::error::Google Play upload failed for a new version. Open the upload step log."
            exit 1
          fi
          echo "::warning::Play upload failed, but this version was already released earlier. Probably the version code was already uploaded. Read the upload step log to be sure."

  apk-preview:
    needs: test
    runs-on: ubuntu-24.04
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build app bundle (accounts off)
        run: node tools/build-app.js
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Check the shrunk release build (throwaway key)
        working-directory: android
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/check.jks" -alias check -keyalg RSA -keysize 2048 -validity 1 \
            -storepass checkpass -keypass checkpass -dname "CN=CI check"
          ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/check.jks" ANDROID_KEYSTORE_PASSWORD=checkpass ANDROID_KEY_ALIAS=check ANDROID_KEY_PASSWORD=checkpass \
            ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: interview-mastery-preview-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

