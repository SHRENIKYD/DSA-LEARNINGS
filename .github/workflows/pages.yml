name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build static site (strict, no skipped modules)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build.js site --strict
      - name: Add offline support
        run: node tools/sw-build.js site
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Smoke test the built site
        run: node tools/smoke-test.js site
  build:
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build.js site
      - name: Add offline support
        run: node tools/sw-build.js site
      - name: Tag the website version (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/web-v$V" >/dev/null; then echo "web-v$V is already tagged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "web-v$V" "$GITHUB_SHA" -m "Website v$V"
          git push origin "refs/tags/web-v$V"
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
