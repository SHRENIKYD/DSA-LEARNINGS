name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site (strict, no skipped modules)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build.js site --strict
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Smoke test the built site
        run: node tools/smoke-test.js site
  build:
    needs: test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build static site
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
        run: node tools/build.js site
      - name: Tag the website version (main only)
        if: github.ref == 'refs/heads/main'
        run: |
          V=$(node -p "require('./package.json').version")
          if git ls-remote --exit-code --tags origin "refs/tags/web-v$V" >/dev/null; then echo "web-v$V is already tagged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "web-v$V" "$GITHUB_SHA" -m "Website v$V"
          git push origin "refs/tags/web-v$V"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
