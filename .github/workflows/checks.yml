name: Content checks

on:
  push:
    branches: [main, claude/dsa-math-study-portal-weghh9]
    paths: ['content/**', 'src/paths.js', 'src/tracks.js', 'src/video.js', 'src/engine.js', 'src/videos.html', 'data/videos.json', 'data/video-review.json', 'tools/**', 'vendor/sql-wasm*', '.github/workflows/checks.yml']
  pull_request:
    paths: ['content/**', 'src/paths.js', 'src/tracks.js', 'src/video.js', 'src/engine.js', 'src/videos.html', 'data/videos.json', 'data/video-review.json', 'tools/**', 'vendor/sql-wasm*', '.github/workflows/checks.yml', 'src/**', 'package.json']
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  videos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate reviewed video mappings and playback helpers
        run: node tools/video-test.js

  smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build static site (strict)
        run: node tools/build.js site --strict
      - name: Add offline support
        run: node tools/sw-build.js site
      - run: npm ci
      - name: Install Playwright
        run: npm install --no-save playwright@1.56.1 && npx playwright install --with-deps chromium
      - name: Smoke test the built site
        run: node tools/smoke-test.js site
      - name: Accessibility test
        run: node tools/a11y-test.js
      - name: Offline test
        run: node tools/sw-test.js

  paths:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Route, prerequisite and schedule checks
        run: node tools/paths-check.js --strict

  changed:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/toolchain
      - name: Validate and test changed modules
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          node tools/ci-check.js --base "$BASE"

  full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        track: [dsa, lld, java, py, js, cpp, sql, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
      - name: Validate and test every ${{ matrix.track }} module
        run: node tools/ci-check.js --track ${{ matrix.track }}

  auth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Progress-sync unit tests
        run: node tools/auth-test.js
      - name: Release tool test
        run: node tools/release-test.js
      - name: What's new popup data
        run: node tools/whatsnew-test.js
      - name: Local reminder planner
        run: node tools/notify-test.js
      - name: Riddle and interview hints
        run: node tools/hints-check.js --require
      - name: Visit statistics test
        run: node tools/visits-test.js
