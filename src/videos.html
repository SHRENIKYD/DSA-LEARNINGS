<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){function t(){var v;try{v=JSON.parse(localStorage.getItem('imastery.theme'))}catch(e){}document.documentElement.setAttribute('data-theme',v==='light'?'light':'dark')}t();addEventListener('pageshow',t);addEventListener('storage',function(e){if(e.key==='imastery.theme')t()})})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watchtower — Interview Mastery</title>
<meta name="description" content="Video explanations for every Interview Mastery topic: DSA, Java, Python, JS/TS, C++, SQL, system design, frontend, backend, GenAI, OS and networks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:wght@500;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=@@V@@">
</head>
<body class="vpage">
@@JBAR@@
<main class="vmain">
  <div class="vtop"><div><span class="kicker">The watchtower · videos</span><h1>See every landmark explained</h1><p class="vcount" id="vcount"></p></div></div>
  <div class="vtools">
    <label class="sbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="vsearch" type="search" placeholder="Search landmarks, videos or channels" aria-label="Search videos" autocomplete="off"></label>
    <label class="vsel"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M3 12h12M3 18h6"/></svg><select id="vtrack" aria-label="Track"></select><svg class="ic chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></label>
  </div>
  <div id="vlist" aria-live="polite"></div>
  <p class="vid-note">Videos play from YouTube when you tap them, in its privacy-enhanced player. They are picked automatically for each topic and new ones are added every day.</p>
</main>
<script src="assets/tracks.js?v=@@V@@"></script>
<script src="assets/video-library.js?v=@@V@@"></script>
<script src="assets/journey.js?v=@@V@@"></script>
<script>
(function () {
  var L = window.IM_VIDEO_LIB || { total: 0, tracks: [] }, cur = 'all', q = '';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var all = 0; L.tracks.forEach(function (t) { all += t.items.length; });
  $('#vcount').textContent = all ? all.toLocaleString('en-US') + ' of ' + L.total.toLocaleString('en-US') + ' landmarks have a video. Coverage notes explain what each video teaches.' : 'Videos are being added. Check back soon.';
  function chips() {
    $('#vtrack').innerHTML = [['all', 'All tracks', all]].concat(L.tracks.map(function (t) { return [t.id, t.title, t.items.length]; })).map(function (c) {
      return '<option value="' + esc(c[0]) + '"' + (c[0] === cur ? ' selected' : '') + '>' + esc(c[1]) + ' · ' + c[2] + '</option>';
    }).join('');
  }
  function item(t, v) {
    var mins = LessonVideo.label(v);
    return '<article class="vitem"><button type="button" class="vid-play vthumb" ' + LessonVideo.attrs(v) + ' aria-label="Play video: ' + esc(v.title) + '"><span class="vid-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></span><b hidden>' + esc(v.title) + '</b></button>' +
      '<span class="kicker">Place ' + v.mn + ' · ' + esc(v.mt) + '</span><h3>' + esc(v.tt) + '</h3><p class="vmeta">' + esc(v.title) + ' · ' + esc(v.channel) + ' · ' + mins + 'YouTube</p>' +
      (v.note ? '<p class="vmeta">' + esc(v.note) + '</p>' : '') +
      '<a class="vid-open" href="' + esc(LessonVideo.watchUrl(v)) + '" target="_blank" rel="noopener noreferrer">Open on YouTube</a> · <a class="vlesson" href="' + esc(t.id) + '.html#' + esc(v.tid) + '">Visit the landmark ›</a></article>';
  }
  function render() {
    var words = q.toLowerCase().split(/\s+/).filter(Boolean), h = '', n = 0;
    L.tracks.forEach(function (t) {
      if (cur !== 'all' && t.id !== cur) return;
      var rows = t.items.filter(function (v) { var hay = (v.tt + ' ' + v.title + ' ' + v.channel + ' ' + v.mt + ' ' + t.short).toLowerCase(); return words.every(function (w) { return hay.indexOf(w) >= 0; }); });
      if (!rows.length) return;
      n += rows.length;
      h += '<section class="vtrack"><h2><span class="kicker c-' + Journey.regionOf(t.id).color + '">' + esc(Journey.regionOf(t.id).name) + '</span>' + esc(t.title) + ' <small>' + rows.length + ' video' + (rows.length === 1 ? '' : 's') + '</small></h2><div class="vgrid">' + rows.map(function (v) { return item(t, v); }).join('') + '</div></section>';
    });
    $('#vlist').innerHTML = h || (all ? '<p class="vempty">No videos match “' + esc(q) + '”.</p>' : '');
  }
  $('#vtrack').addEventListener('change', function () { cur = this.value; render(); });
  var tmr; $('#vsearch').addEventListener('input', function () { var v = this.value; clearTimeout(tmr); tmr = setTimeout(function () { q = v.trim(); render(); }, 120); });
  $('#vlist').addEventListener('click', function (e) {
    var b = e.target.closest('.vid-play'); if (!b) return;
    var id = b.getAttribute('data-vid'); if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
    var fr = document.createElement('div'); fr.className = 'vid-frame';
    fr.innerHTML = '<iframe src="' + LessonVideo.embedUrl(LessonVideo.fromButton(b)) + '" title="' + esc(b.querySelector('b').textContent) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    b.replaceWith(fr);
  });
  Journey.bar({ theme: true });
  var want = decodeURIComponent(location.hash.slice(1));
  if (L.tracks.some(function (t) { return t.id === want; })) cur = want;
  chips(); render();
})();
</script>
</body>
</html>
