<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>(function(){function t(){var v;try{v=JSON.parse(localStorage.getItem('imastery.theme'))}catch(e){}document.documentElement.setAttribute('data-theme',v==='light'?'light':'dark')}t();addEventListener('pageshow',t);addEventListener('storage',function(e){if(e.key==='imastery.theme')t()})})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Videos — Interview Mastery</title>
<meta name="description" content="Video explanations for every Interview Mastery topic: DSA, Java, Python, JS/TS, C++, SQL, system design, frontend, backend, GenAI, OS and networks.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/style.css?v=@@V@@">
</head>
<body class="vpage">
<header class="vhead">
  <a class="brand" href="index.html"><span class="logo">IM</span><div>Interview Mastery<small>Videos</small></div></a>
  <div class="side-row"><a class="btn" href="index.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a><button id="themeBtn" class="btn" type="button">Theme</button></div>
</header>
<main class="vmain">
  <h1>Videos</h1>
  <p class="vcount" id="vcount"></p>
  <label class="sbox"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="vsearch" type="search" placeholder="Search topics, videos or channels" aria-label="Search videos" autocomplete="off"></label>
  <div class="vchips" id="vchips" role="tablist" aria-label="Tracks"></div>
  <div id="vlist" aria-live="polite"></div>
  <p class="vid-note">Videos play from YouTube when you tap them, in its privacy-enhanced player. They are picked automatically for each topic and new ones are added every day.</p>
</main>
<script src="assets/video-library.js?v=@@V@@"></script>
<script>
(function () {
  var L = window.IM_VIDEO_LIB || { total: 0, tracks: [] }, cur = 'all', q = '';
  var $ = function (s) { return document.querySelector(s); };
  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  var all = 0; L.tracks.forEach(function (t) { all += t.items.length; });
  $('#vcount').textContent = all ? all.toLocaleString('en-US') + ' of ' + L.total.toLocaleString('en-US') + ' topics have a video so far.' : 'Videos are being added. Check back soon.';
  function chips() {
    $('#vchips').innerHTML = [['all', 'All', all]].concat(L.tracks.map(function (t) { return [t.id, t.short, t.items.length]; })).map(function (c) {
      return '<button type="button" role="tab" class="vchip' + (c[0] === cur ? ' on' : '') + '" aria-selected="' + (c[0] === cur) + '" data-t="' + esc(c[0]) + '">' + esc(c[1]) + ' · ' + c[2] + '</button>';
    }).join('');
  }
  function item(t, v) {
    var mins = v.secs ? Math.max(1, Math.round(v.secs / 60)) + ' min · ' : '';
    return '<article class="box vid vitem"><span class="tag">' + esc(t.short) + ' · Module ' + v.mn + ' · ' + esc(v.mt) + '</span><h3>' + esc(v.tt) + '</h3>' +
      '<button type="button" class="vid-play" data-vid="' + esc(v.id) + '" aria-label="Play video: ' + esc(v.title) + '"><span class="vid-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></span><span class="vid-meta"><b>' + esc(v.title) + '</b><small>' + esc(v.channel) + ' · ' + mins + 'YouTube</small></span></button>' +
      '<a class="vlesson" href="' + esc(t.id) + '.html#' + esc(v.tid) + '">Open the lesson ›</a></article>';
  }
  function render() {
    var words = q.toLowerCase().split(/\s+/).filter(Boolean), h = '', n = 0;
    L.tracks.forEach(function (t) {
      if (cur !== 'all' && t.id !== cur) return;
      var rows = t.items.filter(function (v) { var hay = (v.tt + ' ' + v.title + ' ' + v.channel + ' ' + v.mt + ' ' + t.short).toLowerCase(); return words.every(function (w) { return hay.indexOf(w) >= 0; }); });
      if (!rows.length) return;
      n += rows.length;
      h += '<section class="vtrack"><h2>' + esc(t.title) + ' <small>' + rows.length + '</small></h2><div class="vgrid">' + rows.map(function (v) { return item(t, v); }).join('') + '</div></section>';
    });
    $('#vlist').innerHTML = h || (all ? '<p class="vempty">No videos match “' + esc(q) + '”.</p>' : '');
  }
  $('#vchips').addEventListener('click', function (e) { var b = e.target.closest('.vchip'); if (!b) return; cur = b.getAttribute('data-t'); chips(); render(); });
  var tmr; $('#vsearch').addEventListener('input', function () { var v = this.value; clearTimeout(tmr); tmr = setTimeout(function () { q = v.trim(); render(); }, 120); });
  $('#vlist').addEventListener('click', function (e) {
    var b = e.target.closest('.vid-play'); if (!b) return;
    var id = b.getAttribute('data-vid'); if (!/^[A-Za-z0-9_-]{11}$/.test(id)) return;
    var fr = document.createElement('div'); fr.className = 'vid-frame';
    fr.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0&playsinline=1" title="' + esc(b.querySelector('b').textContent) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    b.replaceWith(fr);
  });
  var tb = $('#themeBtn');
  function label() { tb.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? 'Light theme' : 'Dark theme'; }
  tb.addEventListener('click', function () { var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('imastery.theme', JSON.stringify(t)); } catch (e) { } document.documentElement.setAttribute('data-theme', t); label(); });
  addEventListener('pageshow', label); addEventListener('storage', label);
  label(); chips(); render();
})();
</script>
</body>
</html>
